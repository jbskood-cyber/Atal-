exerciseId: e25
slug: lumbar-supine-pelvic-tilt
version: 1
locale: es-MX
name: Basculación pélvica en decúbito supino
region: lumbar
category: Control motor
purpose: Mostrar la forma del movimiento; el fisioterapeuta decide indicación, amplitud y dosis.
startingPosition:
  body: Acostado boca arriba sobre una colchoneta, rodillas flexionadas, pies apoyados al ancho de caderas y brazos relajados a los lados.
  support: Colchoneta clínica lisa y firme.
  camera: Vista lateral tres cuartos baja, cuerpo visible desde hombros hasta pies y región lumbopélvica despejada.
movement:
  start: Pelvis en posición neutra con una pequeña curva lumbar natural y glúteos apoyados.
  end: Basculación posterior suave que reduce ligeramente el espacio lumbar sin despegar la pelvis ni elevarla como un puente.
keyCues:
  - Movimiento pequeño y controlado.
  - Pies y hombros permanecen apoyados.
  - Glúteos no se elevan de la colchoneta.
  - Rodillas permanecen alineadas y estables.
  - Respiración relajada, sin esfuerzo visible.
avoidShowing:
  - Elevación de pelvis tipo puente.
  - Flexión cervical o levantamiento de cabeza.
  - Empuje fuerte con los pies.
  - Rodillas separándose o colapsando.
  - Arco lumbar exagerado.
  - Expresión de dolor.
laterality: neutral
requiredEquipment:
  - Colchoneta clínica lisa sin logotipos.
mediaMode: sequence
frames:
  - start
  - end
altText:
  start: Persona acostada boca arriba con rodillas flexionadas y pelvis neutra antes de iniciar una basculación pélvica.
  end: Persona realizando una basculación pélvica posterior suave que reduce el espacio lumbar sin levantar la pelvis de la colchoneta.
reviewStatus: draft
reviewers:
