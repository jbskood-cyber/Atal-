name: live-gemini-smoke

on:
  pull_request:
    paths:
      - 'tests/atal-ai-live-smoke.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-gemini-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify Gemini secret is configured
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}"
      - name: Compile Action Core harness
        run: npm run test:core:compile
      - name: Verify real Gemini patient-create flow
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: npm run test:ai-live > live-agent-e2e.log 2>&1
      - name: Upload live Gemini diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-gemini-diagnostics
          path: live-agent-e2e.log
          if-no-files-found: warn
          retention-days: 1
