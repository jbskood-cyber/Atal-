name: live-gemini-smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-gemini-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify real Gemini credential and function calling
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          set -euo pipefail
          output="$(npm run test:ai-live)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q 'ATAL_AI_LIVE_SMOKE=PASS'
