name: live-gemini-smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-gemini-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify Gemini secret is configured
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}"
      - name: Verify basic Gemini request
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { GoogleGenAI } from '@google/genai';
          const apiKey = process.env.GEMINI_API_KEY?.trim();
          const model = process.env.GEMINI_MODEL?.trim() || 'gemini-3.6-flash';
          const ai = new GoogleGenAI({ apiKey });
          try {
            const response = await ai.models.generateContent({
              model,
              contents: [{ role: 'user', parts: [{ text: 'Responde únicamente: OK' }] }],
            });
            if (!response.text?.trim()) throw new Error('EMPTY_TEXT');
            console.log(`GEMINI_BASIC=PASS model=${model}`);
          } catch (error) {
            console.error(`GEMINI_BASIC=FAIL name=${error?.name ?? 'unknown'} status=${error?.status ?? 'unknown'} code=${error?.code ?? 'unknown'}`);
            process.exit(1);
          }
          NODE
      - name: Verify conceptual turn stays conversational
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ATAL_AI_LIVE_STAGE: conceptual
        run: npm run test:ai-live
      - name: Verify forced function call is emitted
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ATAL_AI_LIVE_STAGE: call-presence
        run: npm run test:ai-live
      - name: Verify settings function arguments
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ATAL_AI_LIVE_STAGE: settings
        run: npm run test:ai-live
      - name: Verify patient-count function arguments
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ATAL_AI_LIVE_STAGE: patients
        run: npm run test:ai-live
