name: behavior-system-quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - name: Upload typecheck log
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: behavior-typecheck-log
          path: typecheck.log
          if-no-files-found: error
          retention-days: 1

  core-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compile core
        shell: bash
        run: |
          set -o pipefail
          npm run test:core:compile 2>&1 | tee core-compile.log
          test -f .tmp/core-tests/src/domain/actions/exerciseActions.js
          test -f .tmp/core-tests/src/domain/actions/sessionActions.js
          test -f .tmp/core-tests/src/domain/actions/patientNoteActions.js
          test -f .tmp/core-tests/src/domain/actions/settingsActions.js
          test -f .tmp/core-tests/src/features/atal-ai/core/tools/canonicalSettingsTools.js
          test -f .tmp/core-tests/src/features/atal-ai/core/agentic/conversationScope.js
      - name: Upload core compile log
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: behavior-core-compile-log
          path: core-compile.log
          if-no-files-found: error
          retention-days: 1

  behavior-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:core:compile
      - name: Run behavior tests
        shell: bash
        run: |
          set -o pipefail
          node --test tests/atal-behavior-system.test.mjs tests/atal-action-transaction-compat.test.mjs tests/atal-patient-record-actions.test.mjs tests/atal-plan-actions.test.mjs tests/atal-plan-association-versioning.test.mjs tests/atal-exercise-actions.test.mjs tests/atal-session-actions.test.mjs tests/atal-session-review-actions.test.mjs tests/atal-session-completion-actions.test.mjs tests/atal-patient-note-actions.test.mjs tests/atal-settings-actions.test.mjs tests/atal-settings-tools.test.mjs tests/atal-settings-ui-routing.test.mjs tests/atal-ai-conversation-isolation.test.mjs tests/atal-behavior-parity-matrix.test.mjs tests/atal-agent-tool-selection.test.mjs 2>&1 | tee behavior-test-output.txt
      - name: Upload behavior test output
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: behavior-test-output
          path: behavior-test-output.txt
          if-no-files-found: error
          retention-days: 1

  legacy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:core:compile
      - name: Run legacy tests individually
        id: legacy
        shell: bash
        run: |
          set +e
          : > legacy-test-failures.txt
          : > legacy-test-output.txt
          for file in tests/*.test.mjs; do
            if [ "$file" = "tests/atal-behavior-system.test.mjs" ] || [ "$file" = "tests/atal-action-transaction-compat.test.mjs" ] || [ "$file" = "tests/atal-patient-record-actions.test.mjs" ] || [ "$file" = "tests/atal-plan-actions.test.mjs" ] || [ "$file" = "tests/atal-plan-association-versioning.test.mjs" ] || [ "$file" = "tests/atal-exercise-actions.test.mjs" ] || [ "$file" = "tests/atal-session-actions.test.mjs" ] || [ "$file" = "tests/atal-session-review-actions.test.mjs" ] || [ "$file" = "tests/atal-session-completion-actions.test.mjs" ] || [ "$file" = "tests/atal-patient-note-actions.test.mjs" ] || [ "$file" = "tests/atal-settings-actions.test.mjs" ] || [ "$file" = "tests/atal-settings-tools.test.mjs" ] || [ "$file" = "tests/atal-settings-ui-routing.test.mjs" ] || [ "$file" = "tests/atal-ai-conversation-isolation.test.mjs" ] || [ "$file" = "tests/atal-behavior-parity-matrix.test.mjs" ] || [ "$file" = "tests/atal-agent-tool-selection.test.mjs" ]; then
              continue
            fi
            echo "=== $file ===" | tee -a legacy-test-output.txt
            node --test "$file" 2>&1 | tee -a legacy-test-output.txt
            code=${PIPESTATUS[0]}
            if [ $code -ne 0 ]; then
              echo "$file" >> legacy-test-failures.txt
            fi
          done
          if [ -s legacy-test-failures.txt ]; then
            echo "Failing legacy test files:"
            cat legacy-test-failures.txt
            exit 1
          fi
      - name: Upload legacy failure manifest
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: legacy-test-failure-manifest
          path: legacy-test-failures.txt
          if-no-files-found: error
          retention-days: 1
      - name: Upload legacy test output
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: legacy-test-output
          path: legacy-test-output.txt
          if-no-files-found: error
          retention-days: 1

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: behavior-build-log
          path: build.log
          if-no-files-found: error
          retention-days: 1
