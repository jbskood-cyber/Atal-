name: e2e

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install Playwright test runner without changing the lockfile
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/playwright-install.log
          for attempt in 1 2 3; do
            echo "=== attempt $attempt ===" | tee -a /tmp/playwright-install.log
            if npm install --no-save --no-package-lock @playwright/test@1.61.1 2>&1 | tee -a /tmp/playwright-install.log; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          exit 1
      - name: Upload Playwright install diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-install-diagnostics
          path: /tmp/playwright-install.log
          if-no-files-found: warn
          retention-days: 3
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run deterministic Atal AI E2E suite
        run: npx playwright test
      - name: Upload Playwright evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
